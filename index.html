<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <meta name="description" content="Aplicativo prêmio de previsão do tempo com radar de satélite responsivo.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="day">
    
    <main class="container">
        
        <section class="weather-card" id="search-card" aria-labelledby="search-title">
            <h1 id="search-title">Estação Climática</h1>
            <p style="font-size: 0.85rem; color: rgba(255,255,255,0.8); margin-bottom: 1.5rem;">Radar Global e Condições Atmosféricas</p>
            <form id="weather-form" aria-label="Formulário de Busca de cidade">
                <div class="input-group">
                    <input type="text" id="city-input" placeholder="Digite uma cidade ou estado" required aria-label="Nome da cidade">
                    <button type="submit" id="search-btn">Buscar</button>
                </div>
            </form>
            
            <div id="loading" class="hidden" aria-live="polite">
                <div class="spinner"></div>
                <p>Analisando Satélites...</p>
            </div>

            <div id="error-message" class="hidden error" aria-live="assertive"></div>
        </section>

        <article class="weather-card hidden" id="result-card" aria-labelledby="result-city">
            
            <header class="weather-info-box">
                <i id="weather-icon" class="wi wi-cloudy" aria-hidden="true"></i>
                <div class="temperature">
                    <span id="result-temp"></span><span class="unit">°</span>
                </div>
            </header>

            <h2 id="result-city"></h2>
            <p id="result-desc"></p>
            <p id="result-date"></p>

            <section class="weather-metrics" id="weather-metrics" aria-label="Métricas Metereológicas Detalhadas">
                <div class="metric">
                    <i class="wi wi-humidity" aria-hidden="true"></i>
                    <div>
                        <span id="result-humidity">--</span><span class="metric-unit">%</span>
                        <p>Umidade</p>
                    </div>
                </div>
                <div class="metric">
                    <i class="wi wi-strong-wind" aria-hidden="true"></i>
                    <div>
                        <span id="result-wind">--</span><span class="metric-unit">km/h</span>
                        <p>Vento</p>
                    </div>
                </div>
                <div class="metric">
                    <i class="wi wi-raindrops" aria-hidden="true"></i>
                    <div>
                        <span id="result-precip">--</span><span class="metric-unit">mm</span>
                        <p>Precipitação</p>
                    </div>
                </div>
            </section>

            <!-- NOVO: Mapa Radar estilo TV -->
            <section class="radar-container" id="radar-container" aria-label="Mapa de Radar Climático em Tempo Real">
                <iframe id="radar-map" src="" width="100%" height="220" frameborder="0" style="border:0;" allowfullscreen></iframe>
            </section>

            <button type="button" id="home-btn" aria-label="Voltar para Nova Análise">
                <svg xmlns="http://www.w3.org/0000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </button>
            
        </article>
    </main>

    <footer class="app-footer">
        <p>Dados por <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" tabindex="-1">Open-Meteo</a> e <a href="https://windy.com" target="_blank" rel="noopener noreferrer" tabindex="-1">Windy</a>. UI por <a href="https://erikflowers.github.io/weather-icons/" target="_blank" rel="noopener noreferrer" tabindex="-1">Weather Icons</a>.</p>
        <p><strong>Auditoria e Privacidade:</strong> Nenhum tracker ou log de rede do seu IP é operado.</p>
    </footer>

    <script src="api.js"></script>
</body>
</html>
