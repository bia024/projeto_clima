<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <meta name="description" content="Aplicativo profissional de previsão do tempo.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="day">
    <main class="container">
        <div class="weather-card" id="search-card">
            <h1>Previsão do Tempo</h1>
            <form id="weather-form" aria-label="Busca de cidade">
                <div class="input-group">
                    <input type="text" id="city-input" placeholder="Digite o nome da cidade" required aria-label="Nome da cidade">
                    <button type="submit" id="search-btn">Buscar</button>
                </div>
            </form>
            
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Buscando...</p>
            </div>

            <div id="error-message" class="hidden error"></div>
        </div>

        <div class="weather-card hidden" id="result-card">
            
            <div class="weather-info-box">
                <i id="weather-icon" class="wi wi-cloudy"></i>
                <div class="temperature">
                    <span id="result-temp"></span><span class="unit">°</span>
                </div>
            </div>

            <h2 id="result-city"></h2>
            <p id="result-desc"></p>
            <p id="result-date"></p>

            <button type="button" id="home-btn" aria-label="Voltar para a pesquisa">
                <svg xmlns="http://www.w3.org/0000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </button>
            
        </div>
    </main>
    <script src="api.js"></script>
</body>
</html>
